  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 r.who }}<\u002Fspan>\n              <sc-if value=\"{{ r.hasConditions }}\">\n                <span style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\">\n                  <sc-for list=\"{{ r.conditions }}\" as=\"cn\" hint-placeholder-count=\"2\">\n                    <span style=\"font-size:12px;color:rgba(78,59,49,.8);background:#F8F4EF;border-radius:999px;padding:3px 10px\">{{ cn.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"display:block;font-size:11.5px;color:rgba(78,59,49,.58);margin-top:11px\">{{ r.foot }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ clientsEmpty }}\">\n          <p style=\"border:1px dashed #EDE0D4;border-radius:10px;padding:44px 16px;text-align:center;font-size:13px;color:rgba(78,59,49,.6);margin:0\">{{ clientsEmpty }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ clientsMore }}\">\n        <button sc-camel-on-click=\"{{ clientsShowMore }}\" style=\"width:100%;margin-top:12px;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;padding:12px;font-size:13px;font-weight:600;color:#5D0703\">{{ clientsMore }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ CAREGIVER · CLIENT ============================ -->\n    <sc-if value=\"{{ isClient }}\">\n    <div data-screen-label=\"Client detail\" style=\"animation:fadeUp .25s ease-out\">\n\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px\">\n        <div style=\"min-width:0\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px\">\n            <h1 data-h1=\"\" style=\"font-size:23px;font-weight:700;letter-spacing:-.025em;color:#5D0703;margin:0\">{{ cl.name }}<\u002Fh1>\n            <span style=\"{{ agrBadgeStyle }}\">{{ agrBadgeLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:13.5px;color:rgba(78,59,49,.6);margin:5px 0 0;text-wrap:pretty\">{{ cl.subline }}<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openActivity }}\" style=\"flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#4E3B31;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:8px;padding:8px 14px\">Activity <span style=\"color:rgba(78,59,49,.5)\">{{ activityCount }}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-two=\"\" style=\"display:grid;grid-template-columns:1fr;gap:18px;margin-top:20px\">\n        <div style=\"min-width:0;display:flex;flex-direction:column;gap:18px\">\n\n          <!-- ============ CARE AGREEMENT ============ -->\n          <section data-focus=\"agreement\">\n            <sc-if value=\"{{ agrNone }}\">\n              <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 14px;padding:17px 18px 15px\">\n                  <div style=\"min-width:0\">\n                    <h2 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">Care agreement<\u002Fh2>\n                    <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:62ch;text-wrap:pretty\">{{ agrNoneBody }}<\u002Fp>\n                  <\u002Fdiv>\n                  <span style=\"{{ agrNoneBadgeStyle }}\">{{ agrNoneTitle }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:1px;background:#F3EAE1\"><\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid #F3EAE1;justify-content:flex-start\">\n                  <button sc-camel-on-click=\"{{ openAgrForm }}\" style=\"font-size:13px;font-weight:500;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:8px 14px\">{{ agrNoneCta }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            \n\n            <sc-if value=\"{{ agrForm }}\">\n              <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px\">\n                <div style=\"padding:17px 18px 0\">\n                  <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:15px\">\n                    <span style=\"flex:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#FC703C\">Step 1 of 2 · draft<\u002Fspan>\n                    <span style=\"flex:1;height:3px;border-radius:999px;background:#F3EAE1;overflow:hidden\"><span style=\"display:block;width:50%;height:100%;background:#FC703C\"><\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                  <h2 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">{{ agrFormTitle }}<\u002Fh2>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:62ch;text-wrap:pretty\">Pick every service this agreement covers, then one hourly rate for all of them. Search, or scan the four groups.<\u002Fp>\n                  <sc-if value=\"{{ isRevision }}\">\n                    <p style=\"font-size:12.5px;line-height:1.5;color:#7A2E1A;background:#FFE0CC;border-radius:9px;padding:11px;margin:12px 0 0;text-wrap:pretty\">{{ revisionNote }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <input type=\"search\" value=\"{{ query }}\" sc-camel-on-input=\"{{ onQuery }}\" aria-label=\"Search services\" placeholder=\"e.g. medication, bathing, wound\" style=\"width:100%;max-width:420px;margin-top:14px;font-size:13.5px;padding:9px 13px;border:1px solid #EDE0D4;border-radius:9px;background:#FFFFFF;color:#5D0703\">\n                <\u002Fdiv>\n\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 18px 0;padding:9px 13px;background:#F8F4EF;border:1px solid #F3EAE1;border-radius:9px\">\n                  <span style=\"font-size:12.5px;font-weight:500;color:#4E3B31\">{{ selectedCountLabel }}<\u002Fspan>\n                  <sc-if value=\"{{ hasSelection }}\">\n                    <button sc-camel-on-click=\"{{ clearSelection }}\" style=\"flex:none;font-size:12.5px;font-weight:500;color:#7A2E1A;background:none;border:none;padding:2px;text-decoration:underline;text-underline-offset:3px\">Clear all<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ agrErr }}\">\n                  <p role=\"alert\" style=\"font-size:12.5px;color:#7A2E1A;background:#FFE0CC;border-radius:9px;padding:10px 12px;margin:14px 18px 0\">{{ agrErr }}<\u002Fp>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ noResults }}\">\n                  <p style=\"font-size:13px;color:rgba(78,59,49,.6);margin:14px 18px 0\">{{ noResults }}<\u002Fp>\n                <\u002Fsc-if>\n\n                <div style=\"display:flex;flex-direction:column;gap:16px;padding:16px 18px 0\">\n                  <sc-for list=\"{{ catalog }}\" as=\"cat\" hint-placeholder-count=\"4\">\n                    <div>\n                      <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:9px\">\n                        <span style=\"flex:none;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#A86B4C\">{{ cat.name }}<\u002Fspan>\n                        <span style=\"flex:1;height:1px;background:#F5EEE6\"><\u002Fspan>\n                        <span style=\"flex:none;font-size:12px;color:rgba(78,59,49,.55)\">{{ cat.picked }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div data-svc=\"\" style=\"display:grid;grid-template-columns:1fr;gap:6px\">\n                        <sc-for list=\"{{ cat.items }}\" as=\"s\" hint-placeholder-count=\"6\">\n                          <label style=\"{{ s.rowStyle }}\">\n                            <input type=\"checkbox\" checked=\"{{ s.selected }}\" sc-camel-on-change=\"{{ s.toggle }}\" style=\"width:16px;height:16px;flex:none;accent-color:#FC703C\">\n                            <span style=\"font-size:13.5px;color:#4E3B31;line-height:1.35\">{{ s.label }}<\u002Fspan>\n                          <\u002Flabel>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"padding:18px\">\n                  <div style=\"height:1px;background:#F3EAE1\"><\u002Fdiv>\n                  <h3 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0;margin-top:16px\">Rate and length<\u002Fh3>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:62ch;text-wrap:pretty\">One rate for every service above, and how long a visit lasts. Changing the length later means a new version of the agreement.<\u002Fp>\n                  <div data-rl=\"\" style=\"display:grid;grid-template-columns:1fr;gap:12px;margin-top:11px;max-width:440px\">\n                    <div>\n                      <label style=\"display:block;font-size:12px;font-weight:600;color:rgba(78,59,49,.7);margin-bottom:5px\">Hourly rate<\u002Flabel>\n                      <div style=\"display:flex;align-items:stretch;border:1px solid #EDE0D4;border-radius:9px;overflow:hidden;background:#FFFFFF\">\n                        <span style=\"display:grid;place-items:center;padding:0 13px;background:#F8F4EF;color:#4E3B31;font-size:15px;font-weight:600;border-right:1px solid #EDE0D4\">€<\u002Fspan>\n                        <input type=\"text\" inputmode=\"decimal\" value=\"{{ agrRate }}\" sc-camel-on-input=\"{{ onAgrRate }}\" aria-label=\"Hourly rate in euro\" placeholder=\"32.00\" style=\"flex:1;min-width:0;border:none;outline-offset:-3px;font-size:15px;font-weight:600;padding:9px;color:#5D0703;background:transparent\">\n                        <span style=\"display:grid;place-items:center;padding:0 11px;color:rgba(78,59,49,.55);font-size:13px\">\u002Fhour<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <label style=\"display:block;font-size:12px;font-weight:600;color:rgba(78,59,49,.7);margin-bottom:5px\">Hours per visit<\u002Flabel>\n                      <div style=\"display:flex;align-items:stretch;border:1px solid #EDE0D4;border-radius:9px;overflow:hidden;background:#FFFFFF\">\n                        <input type=\"text\" inputmode=\"decimal\" value=\"{{ agrHours }}\" sc-camel-on-input=\"{{ onAgrHours }}\" aria-label=\"Hours per visit\" placeholder=\"3\" style=\"flex:1;min-width:0;border:none;outline-offset:-3px;font-size:15px;font-weight:600;padding:9px 12px;color:#5D0703;background:transparent\">\n                        <span style=\"display:grid;place-items:center;padding:0 11px;color:rgba(78,59,49,.55);font-size:13px\">hours<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ rateErr }}\">\n                    <p role=\"alert\" style=\"font-size:12.5px;color:#7A2E1A;margin:8px 0 0\">{{ rateErr }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ hoursErr }}\">\n                    <p role=\"alert\" style=\"font-size:12.5px;color:#7A2E1A;margin:8px 0 0\">{{ hoursErr }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ rateDelta }}\">\n                    <p style=\"font-size:12.5px;color:#7A2E1A;margin:8px 0 0\">{{ rateDelta }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ visitCost }}\">\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.65);margin:8px 0 0\">{{ visitCost }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <h3 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0;margin-top:18px\">Additional terms <span style=\"font-weight:400;font-size:13px;color:rgba(78,59,49,.5)\">optional<\u002Fspan><\u002Fh3>\n                  <textarea value=\"{{ agrTerms }}\" sc-camel-on-input=\"{{ onTerms }}\" rows=\"3\" aria-label=\"Additional terms\" placeholder=\"E.g. I bring my own blood pressure monitor. The key is in the entrance lockbox.\" style=\"width:100%;margin-top:9px;font-size:13.5px;line-height:1.55;padding:10px 12px;border:1px solid #EDE0D4;border-radius:9px;color:#4E3B31;background:#FFFFFF;resize:none\"><\u002Ftextarea>\n\n                  <sc-if value=\"{{ isRevision }}\">\n                    <div style=\"margin-top:16px\">\n                      <h3 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">Why the change<\u002Fh3>\n                      <input value=\"{{ agrNote }}\" sc-camel-on-input=\"{{ onAgrNote }}\" placeholder=\"{{ notePlaceholder }}\" style=\"width:100%;margin-top:9px;border:1px solid #EDE0D4;border-radius:9px;padding:9px 12px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid #F3EAE1\">\n                  <p style=\"font-size:12.5px;color:rgba(78,59,49,.62);margin:0\">{{ draftSummary }}<br><span style=\"color:rgba(78,59,49,.5)\">Nothing is stored until you send it.<\u002Fspan><\u002Fp>\n                  <div style=\"display:flex;gap:8px\">\n                    <button sc-camel-on-click=\"{{ closeAgrForm }}\" style=\"font-size:13px;font-weight:500;color:#4E3B31;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:8px;padding:8px 14px\">Cancel<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ toReview }}\" style=\"font-size:13px;font-weight:500;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:8px 14px\">Review agreement<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ agrReview }}\">\n              <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;overflow:hidden\">\n                <div style=\"padding:17px 18px 18px\">\n                  <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:15px\">\n                    <span style=\"flex:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#FC703C\">Step 2 of 2 · review<\u002Fspan>\n                    <span style=\"flex:1;height:3px;border-radius:999px;background:#F3EAE1;overflow:hidden\"><span style=\"display:block;width:100%;height:100%;background:#FC703C\"><\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                  <h2 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">{{ reviewTitle }}<\u002Fh2>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:62ch;text-wrap:pretty\">A sent agreement is never edited in place — a change always goes out as a new version. Check it over.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 18px;border-top:1px solid #F3EAE1\">\n                  <div>\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0\">Hourly rate · all services<\u002Fp>\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.5);margin:2px 0 0\">Every visit is billed as rate × hours<\u002Fp>\n                  <\u002Fdiv>\n                  <p style=\"flex:none;font-size:23px;font-weight:700;color:#5D0703;margin:0\">{{ reviewRate }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 18px;border-top:1px solid #F3EAE1\">\n                  <div>\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0\">Hours per visit<\u002Fp>\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.5);margin:2px 0 0\">{{ reviewVisitCost }}<\u002Fp>\n                  <\u002Fdiv>\n                  <p style=\"flex:none;font-size:23px;font-weight:700;color:#5D0703;margin:0\">{{ reviewHours }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"padding:14px 18px;border-top:1px solid #F3EAE1\">\n                  <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0 0 11px\">{{ selectedCountLabel }}<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:14px\">\n                    <sc-for list=\"{{ selectedGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                      <div>\n                        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n                          <span style=\"flex:none;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#A86B4C\">{{ g.name }}<\u002Fspan>\n                          <span style=\"flex:1;height:1px;background:#F5EEE6\"><\u002Fspan>\n                          <span style=\"flex:none;font-size:12px;color:rgba(78,59,49,.55)\">{{ g.count }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div data-svc=\"\" style=\"display:grid;grid-template-columns:1fr;gap:6px\">\n                          <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"3\">\n                            <div style=\"display:flex;gap:9px;align-items:flex-start\">\n                              <span style=\"flex:none;margin-top:6px;width:5px;height:5px;border-radius:50%;background:#FC703C\"><\u002Fspan>\n                              <p style=\"font-size:13.5px;line-height:1.4;color:#4E3B31;margin:0\">{{ s.label }}<\u002Fp>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ agrTermsShown }}\">\n                  <div style=\"padding:14px 18px;border-top:1px solid #F3EAE1\">\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0 0 5px\">Additional terms<\u002Fp>\n                    <p style=\"font-size:13.5px;line-height:1.55;color:#4E3B31;margin:0;white-space:pre-wrap\">{{ agrTermsShown }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <p style=\"font-size:12.5px;line-height:1.55;color:#4E3B31;background:#F8F4EF;margin:0;padding:14px 18px;border-top:1px solid #F3EAE1;text-wrap:pretty\">{{ reviewLockNote }}<\u002Fp>\n                <div style=\"display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid #F3EAE1\">\n                  <button sc-camel-on-click=\"{{ backToForm }}\" style=\"font-size:13px;font-weight:500;color:#4E3B31;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:8px;padding:8px 14px\">Back to edit<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ sendAgreement }}\" style=\"font-size:13px;font-weight:500;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:8px 14px\">{{ reviewSendLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ agrPending }}\">\n              <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px\">\n                <div style=\"padding:17px 18px 16px\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px\">\n                    <h2 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">Care agreement<\u002Fh2>\n                    <span style=\"{{ pendingBadgeStyle }}\">{{ pendingBadge }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:12px\">\n                    <span style=\"font-size:23px;font-weight:700;letter-spacing:-.025em;color:#5D0703\">{{ pendingRateLabel }}<\u002Fspan>\n                    <span style=\"font-size:13px;color:rgba(78,59,49,.62)\">{{ pendingServicesLine }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:64ch;text-wrap:pretty\">{{ pendingBody }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"padding:0 18px 16px\">\n                  <div style=\"background:#FBF9F6;border:1px solid #F3EAE1;border-radius:9px;padding:15px 16px\">\n                    <p style=\"font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(78,59,49,.55);margin:0 0 13px\">Before visits open up<\u002Fp>\n                    <div style=\"display:flex;flex-direction:column;gap:13px\">\n                      <sc-for list=\"{{ blockers }}\" as=\"b\" hint-placeholder-count=\"2\">\n                        <div style=\"display:flex;gap:10px;align-items:flex-start\">\n                          <span style=\"{{ b.iconStyle }}\">{{ b.glyph }}<\u002Fspan>\n                          <div style=\"min-width:0\">\n                            <p style=\"font-size:13.5px;font-weight:600;color:#5D0703;margin:0\">{{ b.title }}<\u002Fp>\n                            <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.65);margin:2px 0 0;text-wrap:pretty\">{{ b.detail }}<\u002Fp>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n  agrFlow }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <li style=\"display:flex;align-items:flex-start;gap:8px;flex:1\">\n                        <span style=\"flex:none;margin-top:6px;width:6px;height:6px;border-radius:50%;background:#FC703C\"><\u002Fspan>\n                        <span style=\"min-width:0\">\n                          <span style=\"display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(78,59,49,.55)\">{{ s.when }}<\u002Fspan>\n                          <span style=\"display:block;font-size:12.5px;line-height:1.45;color:rgba(78,59,49,.75)\">{{ s.what }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Fol>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid #F3EAE1;padding:15px 18px\">\n                  <p style=\"font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(78,59,49,.55);margin:0 0 12px\">Services and terms<\u002Fp>\n                  <div data-svc=\"\" style=\"display:grid;grid-template-columns:1fr;gap:14px\">\n                    <sc-for list=\"{{ activeGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                      <div>\n                        <p style=\"font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A86B4C;margin:0 0 7px\">{{ g.name }}<\u002Fp>\n                        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                          <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"3\">\n                            <span style=\"font-size:12.5px;color:#4E3B31;background:#F6EFE7;border-radius:6px;padding:4px 10px\">{{ s.label }}<\u002Fspan>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n  endedRate }}<\u002Fspan>\n                    <span style=\"font-size:13px;color:rgba(78,59,49,.62)\">{{ endedServices }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:64ch;text-wrap:pretty\">This version is read-only and kept for your records.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"height:1px;background:#F3EAE1\"><\u002Fdiv>\n                <dl data-facts=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:0;padding:16px 18px\">\n                  <sc-for list=\"{{ endedFacts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                    <div>\n                      <dt style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(78,59,49,.55)\">{{ f.term }}<\u002Fdt>\n                      <dd style=\"font-size:13.5px;font-weight:600;color:#5D0703;margin:4px 0 0\">{{ f.value }}<\u002Fdd>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdl>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <!-- ============ VERSION HISTORY ============ -->\n          <sc-if value=\"{{ hasVersionHistory }}\">\n            <section>\n              <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px\">\n                <div style=\"padding:17px 18px 15px\">\n                  <h2 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">Agreement history<\u002Fh2>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:62ch;text-wrap:pretty\">A sent version is never edited — every change goes out as its own.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"height:1px;background:#F3EAE1\"><\u002Fdiv>\n                <sc-for list=\"{{ versionRows }}\" as=\"v\" hint-placeholder-count=\"2\">\n                  <div style=\"{{ v.rowStyle }}\">\n                    <div style=\"min-width:0\">\n                      <p style=\"font-size:13.5px;font-weight:500;color:#5D0703;margin:0\">{{ v.title }}<\u002Fp>\n                      <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:3px 0 0\">{{ v.sub }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span style=\"{{ v.badgeStyle }}\">{{ v.badge }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <!-- ============ VISITS ============ -->\n          <section data-focus=\"visits\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 14px;margin-bottom:11px\">\n              <div style=\"min-width:0\">\n                <h2 style=\"font-size:15px;font-weight:600;letter-spacing:-.01em;color:#5D0703;margin:0\">Visits<\u002Fh2>\n                <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.6);margin:3px 0 0;max-width:62ch;text-wrap:pretty\">Reserved when you send the plan, charged after the work order.<\u002Fp>\n              <\u002Fdiv>\n              <sc-if value=\"{{ canNewVisit }}\">\n                <button sc-camel-on-click=\"{{ openVisitForm }}\" style=\"font-size:13px;font-weight:500;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:8px 14px\">New visit<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ visitBanner }}\">\n              <p style=\"display:flex;gap:9px;font-size:13px;line-height:1.5;color:#7A2E1A;background:#FFE0CC;border-radius:10px;padding:12px;margin:0 0 12px;text-wrap:pretty\">{{ visitBanner }}<\u002Fp>\n            <\u002Fsc-if>\n\n            \n\n            <sc-if value=\"{{ visitForm }}\">\n              <div style=\"background:#FFFFFF;border:1px solid #FFA175;border-radius:10px;padding:18p >\n                <sc-if value=\"{{ lateWarn }}\">\n                  <p style=\"font-size:12.5px;line-height:1.5;color:#7A2E1A;margin:7px 0 0\">{{ lateWarn }}<\u002Fp>\n                <\u002Fsc-if>\n                <div style=\"background:#F8F4EF;border-radius:10px;padding:15px 16px;margin-top:18px\">\n                  <div style=\"font-size:13px\">\n                    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13.5px;color:#4E3B31\"><span>Reserved on the card<\u002Fspan><span style=\"font-weight:500\">{{ resGross }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13.5px;color:rgba(78,59,49,.72);margin-top:6px\"><span>Service fee (10%)<\u002Fspan><span>{{ resFee }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;color:#5D0703;font-weight:700;font-size:19px;letter-spacing:-.02em;border-top:1px solid #EDE0D4;margin-top:12px;padding-top:12px\"><span style=\"font-size:14px;letter-spacing:0\">You receive<\u002Fspan><span>{{ resNet }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;gap:8px;margin-top:14px\">\n                  <button sc-camel-on-click=\"{{ sendVisit }}\" style=\"font-size:13.5px;font-weight:600;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:9px 15px\">Send visit and reserve funds<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ closeVisitForm }}\" style=\"font-size:13.5px;font-weight:600;color:#4E3B31;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:8px;padding:9px 15px\">Cancel<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <sc-for list=\"{{ visitGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 9px\">\n                  <h3 style=\"font-size:14px;font-weight:700;color:#5D0703;margin:0\">{{ g.head }}<\u002Fh3>\n                  <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0\">{{ g.count }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ g.items }}\" as=\"v\" hint-placeholder-count=\"3\">\n                <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;padding:15px\">\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n                    <p style=\"min-width:0;font-size:14.5px;font-weight:600;color:#5D0703;margin:0\">{{ v.dateTime }}<\u002Fp>\n                    <p style=\"{{ v.amountStyle }}\">{{ v.amount }}<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:7px\">\n                    <span style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:rgba(78,59,49,.65)\">\n                      <span style=\"{{ v.badgeStyle }}\">{{ v.badge }}<\u002Fspan>{{ v.meta }}\n                    <\u002Fspan>\n                    <span style=\"font-size:11.5px;color:rgba(78,59,49,.55)\">{{ v.moneyLine }}<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ v.notice }}\">\n                    <p style=\"font-size:12.5px;line-height:1.5;color:#7A2E1A;background:#FFE0CC;border-radius:9px;padding:11px;margin:12px 0 0;text-wrap:pretty\">{{ v.notice }}<\u002Fp>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ v.hasCare }}\">\n                    <div style=\"margin-top:12px;border-top:1px solid #F3EAE1;padding-top:12px\">\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                        <sc-for list=\"{{ v.tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n                          <span style=\"font-size:12px;color:#4E3B31;background:#F8F4EF;border-radius:999px;padding:3px 10px\">{{ t.label }}<\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:rgba(78,59,49,.7)\">\n                        <sc-for list=\"{{ v.care }}\" as=\"b\" hint-placeholder-count=\"3\">\n                          <span style=\"{{ b.style }}\">{{ b.text }}<\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ v.noteLine }}\">\n                        <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.72);margin:9px 0 0\">{{ v.noteLine }}<\u002Fp>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ v.woOpen }}\">\n                    <div style=\"margin-top:14px;border-top:1px solid #F3EAE1;padding-top:14px\">\n                      <div style=\"display:flex;flex-direction:column;gap:16px;align-items:stretch\">\n                        <div>\n                          <label style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">Hours worked<\u002Flabel>\n                          <input type=\"number\" min=\"0\" step=\"0.5\" value=\"{{ woHours }}\" sc-camel-on-input=\"{{ onWoHours }}\" style=\"width:100%;max-width:120px;border:1px solid #EDE0D4;border-radius:9px;padding:8px 10px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                        <\u002Fdiv>\n                        <div>\n                          <label style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">What you did<\u002Flabel>\n                          <input value=\"{{ woNote }}\" sc-camel-on-input=\"{{ onWoNote }}\" placeholder=\"Morning routine, breakfast, short walk.\" style=\"width:100%;border:1px solid #EDE0D4;border-radius:9px;padding:8px 11px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n\n                      <div style=\"margin-top:16px;border-top:1px solid #F3EAE1;padding-top:14px\">\n                        <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 8px\">{{ woMoodQuestion }}<\u002Fp>\n                        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                          <sc-for list=\"{{ woMoods }}\" as=\"m\" hint-placeholder-count=\"3\">\n                            <button sc-camel-on-click=\"{{ m.pick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"display:grid;grid-template-columns:1fr;gap:20px;margin-top:16px\">\n                          <div>\n                            <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 7px\">Eating<\u002Fp>\n                            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                              <sc-for list=\"{{ woEating }}\" as=\"s\" hint-placeholder-count=\"3\">\n                                <button sc-camel-on-click=\"{{ s.pick }}\" style-hover=\"border-color:#FC703C;box-shadow:0 1px 2px rgba(93,7,3,.05),0 8px 20px rgba(93,7,3,.08)\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                          <div>\n                            <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 7px\">Moving around<\u002Fp>\n                            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                              <sc-for list=\"{{ woMoving }}\" as=\"s\" hint-placeholder-count=\"3\">\n                                <button sc-camel-on-click=\"{{ s.pick }}\" style-hover=\"border-color:#FC703C;box-shadow:0 1px 2px rgba(93,7,3,.05),0 8px 20px rgba(93,7,3,.08)\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"margin-top:14px\">\n                          <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 3px\">What you got to<\u002Fp>\n                          <p style=\"font-size:12px;color:rgba(78,59,49,.55);margin:0 0 8px\">Everything is ticked — untick anything that did not happen this time.<\u002Fp>\n                          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                            <sc-for list=\"{{ woTaskItems }}\" as=\"t\" hint-placeholder-count=\"3\">\n                              <button sc-camel-on-click=\"{{ t.toggle }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"margin-top:14px\">\n                          <div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:6px\">\n                            <label style=\"font-size:13px;font-weight:600;color:#5D0703\">Something worried you today?<\u002Flabel>\n                            <span style=\"font-size:11.5px;font-weight:500;letter-spacing:.02em;color:rgba(78,59,49,.5)\">OPTIONAL<\u002Fspan>\n                          <\u002Fdiv>\n                          <input value=\"{{ woConcern }}\" sc-camel-on-input=\"{{ onWoConcern }}\" placeholder=\"Unsteady on her feet, and she did not want to eat.\" style=\"width:100%;border:1px solid #EDE0D4;border-radius:9px;padding:8px 11px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                          <p style=\"font-size:12px;line-height:1.5;color:rgba(78,59,49,.62);margin:7px 0 0;text-wrap:pretty\">Leave it empty if the visit was as usual. If something was off, it goes straight to your coordinator — not into the monthly summary the family sees.<\u002Fp>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n\n                      <div style=\"background:#F8F4EF;border-radius:10px;padding:15px 16px;margin-top:20px\">\n                        <div style=\"font-size:13px\">\n                          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13.5px;color:#4E3B31\"><span>{{ woChargeLabel }}<\u002Fspan><span style=\"font-weight:500\">{{ woGross }}<\u002Fspan><\u002Fdiv>\n                          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13.5px;color:rgba(78,59,49,.72);margin-top:6px\"><span>Service fee (10%)<\u002Fspan><span>{{ woFee }}<\u002Fspan><\u002Fdiv>\n                          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;color:#5D0703;font-weight:700;font-size:19px;letter-spacing:-.02em;border-top:1px solid #EDE0D4;margin-top:12px;padding-top:12px\"><span style=\"font-size:14px;letter-spacing:0\">You receive<\u002Fspan><span>{{ woNet }}<\u002Fspan><\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ woReleasedLine }}\">\n                          <p style=\"font-size:12.5px;color:rgba(78,59,49,.75);margin:10px 0 0\">{{ woReleasedLine }}<\u002Fp>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ woExtraLine }}\">\n                          <p style=\"font-size:12.5px;color:#7A2E1A;margin:10px 0 0\">{{ woExtraLine }}<\u002Fp>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n\n                      <div style=\"display:flex;gap:8px;margin-top:14px\">\n                        <button sc-camel-on-click=\"{{ sendWorkOrder }}\" style=\"font-size:13.5px;font-weight:600;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:9px 15px\">Send work order<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ closeWo }}\" style=\"font-size:13.5px;font-weight:600;color:#4E3B31;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:8px;padding:9px 15px\">Cancel<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ v.hasActions }}\">\n                    <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:12px;border-top:1px solid #F3EAE1;padding-top:12px\">\n                      <sc-if value=\"{{ v.canCancel }}\">\n                        <button sc-camel-on-click=\"{{ v.askCancel }}\" style=\"font-size:13px;font-weight:600;color:#9C3B2E;background:#FFFFFF;border:1px solid rgba(156,59,46,.35);border-radius:8px;padding:7px 13px\">{{ v.cancelLabel }}<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ v.canClose }}\">\n                        <button sc-camel-on-click=\"{{ v.openWo }}\" style=\"font-size:13px;font-weight:600;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:7px 13px\">Confirm what you did<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  \n                <\u002Fdiv>\n              <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noVisits }}\">\n                <div style=\"border:1px dashed #EDE0D4;border-radius:10px;padding:34px;text-align:center;font-size:13px;color:rgba(78,59,49,.55)\">{{ noVisitsText }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ moreVisits }}\">\n              <button sc-camel-on-click=\"{{ showMoreVisits }}\" style=\"width:100%;margin-top:12px;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;padding:11px;font-size:13px;font-weight:600;color:#5D0703\">{{ moreVisits }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <!-- =============== RIGHT RAIL =============== -->\n        <aside data-rail=\"\" style=\"align-self:start\">\n          <div style=\"{{ nextCardStyle }}\">\n            <p style=\"font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(78,59,49,.55);margin:0 0 8px\">Next step<\u002Fp>\n            <p style=\"font-size:13.5px;line-height:1.55;color:#4E3B31;margin:0 0 12px;text-wrap:pretty\">{{ nextStepCopy }}<\u002Fp>\n            <sc-if value=\"{{ nextLabel }}\">\n              <button sc-camel-on-click=\"{{ nextAction }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ nextBlocked }}\">\n              <p style=\"font-size:12.5px;line-height:1.5;color:rgba(78,59,49,.6);margin:10px 0 0\">{{ nextBlocked }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;padding:16px;margin-top:12px\">\n            <p style=\"font-size:14px;font-weight:600;color:#5D0703;margin:0 0 11px\">At a glance<\u002Fp>\n            <sc-for list=\"{{ railFacts }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #F3EAE1\">\n                <span style=\"font-size:12.5px;color:rgba(78,59,49,.7)\">{{ f.term }}<\u002Fspan>\n                <span style=\"font-size:14px;font-weight:700;color:#5D0703\">{{ f.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"font-size:12px;line-height:1.5;color:rgba(78,59,49,.55);margin:12px 0 0\">{{ railNote }}<\u002Fp>\n            <button sc-camel-on-click=\"{{ goEarningsFromRail }}\" style=\"margin-top:10px;font-size:12.5px;font-weight:500;color:#FC703C;background:none;border:none;padding:0\">Open earnings →<\u002Fbutton>\n          <\u002Fdiv>\n\n          \n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============================ CAREGIVER · EARNINGS ============================ -->\n    <sc-if value=\"{{ isEarn }}\">\n    <div data-screen-label=\"Earnings\" style=\"animation:fadeUp .25s ease-out\">\n      <h1 data-h1=\"\" style=\"font-size:23px;font-weight:700;letter-spacing:-.025em;color:#5D0703;margin:0\">Earnings<\u002Fh1>\n      <p style=\"font-size:14px;color:rgba(78,59,49,.62);margin:4px 0 0;text-wrap:pretty\">Every visit, from the moment funds are reserved to the moment they reach you. All amounts are after the 10% service fee.<\u002Fp>\n\n      <div data-stats=\"\" style=\"display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px\">\n        <sc-for list=\"{{ earnCards }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ s.pick }}\" style-hover=\"border-color:#FC703C;box-shadow:0 1px 2px rgba(93,7,3,.05),0 8px 20px rgba(93,7,3,.08)\" style=\"{{ s.style }}\">\n            <div style=\"font-size:22px;font-weight:700;letter-spacing:-.025em;color:#5D0703;line-height:1.15\">{{ s.value }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:rgba(78,59,49,.68);margin-top:3px\">{{ s.label }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:rgba(78,59,49,.5);margin-top:8px\">{{ s.detail }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:26px\">\n        <span style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(78,59,49,.55)\">Your visits<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:10px\">\n          <sc-if value=\"{{ earnFiltering }}\">\n            <button sc-camel-on-click=\"{{ earnReset }}\" style=\"font-size:13px;font-weight:600;color:#FC703C;background:none;border:none;padding:0\">Show everything<\u002Fbutton>\n          <\u002Fsc-if>\n          <span style=\"position:relative\">\n            <button sc-camel-on-click=\"{{ earnMenuToggle }}\" aria-haspopup=\"listbox\" style=\"{{ earnTriggerStyle }}\">\n              {{ earnClientLabel }}\n              <span aria-hidden=\"true\" style=\"font-size:9px;opacity:.55\">▼<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ earnMenuOpen }}\">\n              <span sc-camel-on-click=\"{{ earnMenuClose }}\" style=\"position:fixed;inset:0;z-index:20;display:block\"><\u002Fspan>\n              <span role=\"listbox\" style=\"position:absolute;top:calc(100% + 5px);right:0;z-index:30;min-width:210px;display:flex;flex-direction:column;gap:1px;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;padding:5px;box-shadow:0 12px 30px rgba(93,7,3,.14)\">\n                <sc-for list=\"{{ earnFamilies }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <sc-if value=\"{{ f.isHead }}\">\n                    <span style=\"display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(78,59,49,.5);padding:8px 8px 4px\">{{ f.headLabel }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ f.label }}\">\n                    <button role=\"option\" sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\"><span style=\"{{ f.tickStyle }}\">✓<\u002Fspan>{{ f.label }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:18px;margin-top:12px\">\n        <sc-for list=\"{{ earnGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 9px\">\n            <h3 style=\"font-size:14px;font-weight:700;color:#5D0703;margin:0\">{{ g.head }}<\u002Fh3>\n            <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0\">{{ g.total }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <button data-card=\"\" sc-camel-on-click=\"{{ r.open }}\" style-hover=\"border-color:#FC703C;box-shadow:0 1px 2px rgba(93,7,3,.05),0 8px 20px rgba(93,7,3,.08)\" style=\"display:block;width:100%;text-align:left;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:10px;padding:15px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n              <p style=\"min-width:0;font-size:14.5px;font-weight:600;color:#5D0703;margin:0\">{{ r.title }}<\u002Fp>\n              <span style=\"display:flex;align-items:baseline;gap:9px;flex:none\">\n                <span style=\"{{ r.amountStyle }}\">{{ r.amount }}<\u002Fspan>\n                <span data-chev=\"\" aria-hidden=\"true\" style=\"font-size:15px;line-height:1;color:#C9B7A6\">&#8250;<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:7px\">\n              <span style=\"{{ r.badgeStyle }}\">{{ r.badge }}<\u002Fspan>\n              <span style=\"font-size:12px;color:rgba(78,59,49,.6)\">{{ r.meta }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ r.summary }}\">\n              <p style=\"font-size:11.5px;color:rgba(78,59,49,.6);margin:12px 0 0;border-top:1px solid #F3EAE1;padding-top:11px;text-wrap:pre urs }}<\u002Fspan>\n                  <\u002Fp>\n                  <p style=\"font-size:13px;line-height:1.5;color:rgba(78,59,49,.62);margin:6px 0 0;text-wrap:pretty\">One rate for every service below. {{ reviewVisitCost }}.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"padding:20px 0 0;margin-top:20px;border-top:1px solid #F3EAE1\">\n                  <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0 0 14px\">{{ selectedCountLabel }}<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:14px\">\n                    <sc-for list=\"{{ selectedGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                      <div>\n                        <p style=\"font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#A86B4C;margin:0 0 9px\">{{ g.name }}<\u002Fp>\n                        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                          <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"3\">\n                            <span style=\"flex:none;white-space:nowrap;font-size:12.5px;font-weight:500;border-radius:999px;padding:6px 12px;border:1px solid rgba(93,7,3,.22);background:transparent;color:#5D0703\">{{ s.label }}<\u002Fspan>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ agrTermsShown }}\">\n                  <div style=\"padding:20px 0 0\">\n                    <p style=\"font-size:12.5px;color:rgba(78,59,49,.6);margin:0 0 5px\">Additional terms<\u002Fp>\n                    <p style=\"font-size:13.5px;line-height:1.55;color:#4E3B31;margin:0;white-space:pre-wrap\">{{ agrTermsShown }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <p style=\"font-size:12.5px;line-height:1.55;color:#4E3B31;background:#F8F4EF;margin:20px 0 0;padding:13px 14px;border-radius:10px;text-wrap:pretty\">{{ reviewLockNote }}<\u002Fp>\n                \n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPlanModal }}\">\n              <div>\n                <p style=\"font-size:13px;color:rgba(78,59,49,.6);margin:0 0 14px\">Sending it reserves the money on the family's card. Nothing is taken until you have been and confirmed what you did.<\u002Fp>\n                <div data-vrow=\"\" style=\"display:grid;gap:12px\">\n                  <div>\n                    <span style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">Day<\u002Fspan>\n                    <div data-day=\"\">\n                      <button sc-camel-on-click=\"{{ setToday }}\" style=\"{{ dayTodayStyle }}\">Today<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ setTomorrow }}\" style=\"{{ dayTomorrowStyle }}\">Tomorrow<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <label style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">Starts at<\u002Flabel>\n                    <input type=\"time\" value=\"{{ vStart }}\" sc-camel-on-input=\"{{ onVStart }}\" style=\"border:1px solid #EDE0D4;border-radius:9px;padding:8px 10px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                  <\u002Fdiv>\n                  <div>\n                    <span style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">Hours<\u002Fspan>\n                    <p data-hrs=\"\" style=\"display:flex;align-items:baseline;gap:7px;font-size:13.5px;color:#4E3B31;background:#F8F4EF;border:1px solid #EDE0D4;border-radius:9px;padding:8px 12px;margin:0\">\n                      <span style=\"font-weight:600;color:#5D0703\">{{ agreedHours }}<\u002Fspan>\n                      <span style=\"font-size:12px;color:rgba(78,59,49,.6)\">as agreed<\u 02Fp>\n                <p style=\"font-size:13.5px;line-height:1.55;color:#4E3B31;margin:0\">{{ woViewNote }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"margin-top:20px\">\n                <p style=\"font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#A86B4C;margin:0 0 9px\">How the visit went<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:5px\">\n                  <sc-for list=\"{{ woViewCare }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <p style=\"font-size:13.5px;color:#4E3B31;margin:0\">{{ b.text }}<\u002Fp>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:20px\">\n                <p style=\"font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#A86B4C;margin:0 0 9px\">What you got to<\u002Fp>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ woViewTasks }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <span style=\"flex:none;white-space:nowrap;font-size:12.5px;font-weight:500;border-radius:999px;padding:6px 12px;border:1px solid rgba(93,7,3,.22);background:transparent;color:#5D0703\">{{ s.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"background:#F8F4EF;border-radius:10px;padding:15px 16px;margin-top:20px\">\n              <div style=\"font-size:13px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13.5px;color:#4E3B31\"><span>{{ woViewChargeLabel }}<\u002Fspan><span style=\"font-weight:500\">{{ woViewGross }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:13.5px;color:rgba(78,59,49,.72);margin-top:6px\"><span>Service fee (10%)<\u002Fspan><span>{{ woViewFee }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;color:#5D0703;font-weight:700;font-size:19px;letter-spacing:-.02em;border-top:1px solid #EDE0D4;margin-top:12px;padding-top:12px\"><span style=\"font-size:14px;letter-spacing:0\">You receive<\u002Fspan><span>{{ woViewNet }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isWoModal }}\">\n                    <div>\n                      <div style=\"display:flex;flex-direction:column;gap:16px;align-items:stretch\">\n                        <div>\n                          <label style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">Hours worked<\u002Flabel>\n                          <input type=\"number\" min=\"0\" step=\"0.5\" value=\"{{ woHours }}\" sc-camel-on-input=\"{{ onWoHours }}\" style=\"width:100%;max-width:120px;border:1px solid #EDE0D4;border-radius:9px;padding:8px 10px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                        <\u002Fdiv>\n                        <div>\n                          <label style=\"display:block;font-size:13px;font-weight:600;color:#5D0703;margin-bottom:6px\">What you did<\u002Flabel>\n                          <input value=\"{{ woNote }}\" sc-camel-on-input=\"{{ onWoNote }}\" placeholder=\"Morning routine, breakfast, short walk.\" style=\"width:100%;border:1px solid #EDE0D4;border-radius:9px;padding:8px 11px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n\n                      <div style=\"margin-top:16px;border-top:1px solid #F3EAE1;padding-top:14px\">\n                        <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 8px\">{{ woMoodQuestion }}<\u002Fp>\n                        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                          <sc-for list=\"{{ woMoods }}\" as=\"m\" hint-placeholder-count=\"3\">\n                            <button sc-camel-on-click=\"{{ m.pick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"display:grid;grid-template-columns:1fr;gap:20px;margin-top:16px\">\n                          <div>\n                            <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 7px\">Eating<\u002Fp>\n                            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                              <sc-for list=\"{{ woEating }}\" as=\"s\" hint-placeholder-count=\"3\">\n                                <button sc-camel-on-click=\"{{ s.pick }}\" style-hover=\"border-color:#FC703C;box-shadow:0 1px 2px rgba(93,7,3,.05),0 8px 20px rgba(93,7,3,.08)\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                          <div>\n                            <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 7px\">Moving around<\u002Fp>\n                            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                              <sc-for list=\"{{ woMoving }}\" as=\"s\" hint-placeholder-count=\"3\">\n                                <button sc-camel-on-click=\"{{ s.pick }}\" style-hover=\"border-color:#FC703C;box-shadow:0 1px 2px rgba(93,7,3,.05),0 8px 20px rgba(93,7,3,.08)\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"margin-top:14px\">\n                          <p style=\"font-size:13px;font-weight:600;color:#5D0703;margin:0 0 3px\">What you got to<\u002Fp>\n                          <p style=\"font-size:12px;color:rgba(78,59,49,.55);margin:0 0 8px\">Everything is ticked — untick anything that did not happen this time.<\u002Fp>\n                          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                            <sc-for list=\"{{ woTaskItems }}\" as=\"t\" hint-placeholder-count=\"3\">\n                              <button sc-camel-on-click=\"{{ t.toggle }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"margin-top:14px\">\n                          <div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:6px\">\n                            <label style=\"font-size:13px;font-weight:600;color:#5D0703\">Something worried you today?<\u002Flabel>\n                            <span style=\"font-size:11.5px;font-weight:500;letter-spacing:.02em;color:rgba(78,59,49,.5)\">OPTIONAL<\u002Fspan>\n                          <\u002Fdiv>\n                          <input value=\"{{ woConcern }}\" sc-camel-on-input=\"{{ onWoConcern }}\" placeholder=\"Unsteady on her feet, and she did not want to eat.\" style=\"width:100%;border:1px solid #EDE0D4;border-radius:9px;padding:8px 11px;font-size:13.5px;color:#4E3B31;background:#FFFFFF\">\n                          <p style=\"font-size:12px;line-height:1.5;color:rgba(78,59,49,.62);margin:7px 0 0;text-wrap:pretty\">Leave it empty if the visit was as usual. If something was off, it goes straight to your coordinator — not into the monthly summary the family sees.<\u002Fp>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n\n                      <div style=\"background:#F8F4EF;border-radius:10px;padding:15px 16px;margin-top:20px\">\n                        <div style=\"font-size:13px\">\n                          <div style=\"display:
