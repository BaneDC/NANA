"{{ woViewCanFill }}\">\n              <button sc-camel-on-click=\"{{ woViewFill }}\" style=\"font-size:13px;font-weight:500;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:8px 14px\">Fill in work order<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isAgrModal }}\">\n          <div style=\"flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid #F3EAE1;background:#FFFFFF\">\n            <p style=\"font-size:12.5px;color:rgba(78,59,49,.62);margin:0\">{{ draftSummary }}<br><span style=\"color:rgba(78,59,49,.5)\">Nothing is stored until you send it.<\u002Fspan><\u002Fp>\n            <div style=\"display:flex;gap:8px\">\n              <button sc-camel-on-click=\"{{ closeAgrForm }}\" style=\"font-size:13px;font-weight:500;color:#4E3B31;background:#FFFFFF;border:1px solid #EDE0D4;border-radius:8px;padding:8px 14px\">Cancel<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toReview }}\" style=\"font-size:13px;font-weight:500;color:#FFF8F0;background:#FC703C;border:none;border-radius:8px;padding:8px 14px\">Review agreement<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== SIMULATION BAR ===================== -->\n  <div data-simbar=\"\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:60;background:#2E2723;border-top:1px solid rgba(255,248,240,.14)\">\n    <div style=\"display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 14px\">\n      <span style=\"flex:none;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,248,240,.55)\">Simulation<\u002Fspan>\n      <span style=\"flex:none;font-size:11.5px;color:rgba(255,248,240,.7);background:rgba(255,248,240,.1);border-radius:7px;padding:4px 9px;white-space:nowrap\">{{ simNow }}<\u002Fspan>\n      <span style=\"flex:none;font-size:11.5px;color:rgba(255,248,240,.5);white-space:nowrap\">{{ signInLabel }}<\u002Fspan>\n      <sc-for list=\"{{ signIns }}\" as=\"s\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ s.pick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <sc-for list=\"{{ simActions }}\" as=\"a\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ a.run }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"flex:none;margin-left:auto;display:flex;align-items:center;gap:8px\">\n        <span style=\"flex:none;display:flex;overflow:hidden;border:1px solid rgba(255,248,240,.25);border-radius:8px\">\n          <button sc-camel-on-click=\"{{ goRoleCg }}\" style=\"{{ roleCgStyle }}\">Caregiver<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goRoleCl }}\" style=\"{{ roleClStyle }}\">Family<\u002Fbutton>\n        <\u002Fspan>\n        <button sc-camel-on-click=\"{{ advance24 }}\" style=\"flex:none;font-size:11.5px;font-weight:600;color:#FFF8F0;background:rgba(255,248,240,.12);border:1px solid rgba(255,248,240,.25);border-radius:8px;padding:6px 11px;white-space:nowrap\">Advance 24 h<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ vpToggle }}\" title=\"{{ vpTitle }}\" aria-label=\"{{ vpTitle }}\" style=\"flex:none;width:28px;height:28px;display:grid;place-items:center;color:rgba(255,248,240,.62);background:rgba(255,248,240,.12);border:1px solid rgba(255,248,240,.25);border-radius:8px;padding:0;cursor:pointer\" style-hover=\"color:#FFF8F0\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ vpIcon }}\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== TOAST ===================== -->\n  <sc-if value=\"{{ toast }}\">\n    <div style=\"position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:90;background:#2E2723;color:#FFF8F0;font-size:13px;border-radius:10px;padding:10px 16px;box-shadow:0 14px 40px rgba(93,7,3,.28);animation:pop .2s ease-out;max-width:92vw;text-align:center\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst CATALOG = [\n  { name: \"Care assistance\", items: [\"Grocery shopping\", \"Pharmacy pickup\", \"Food preparation\", \"Assistance with eating and drinking\", \"Light cleaning\", \"Laundry\", \"Changing bed linens\", \"Taking out trash\", \"Companionship\", \"Walks \u002F outdoor activities\", \"Transportation to appointments\", \"Doctor visit accompaniment\", \"Errands such as bank or post office\", \"Reading, games and social activities\", \"Help with technology\", \"Pet care\"] },\n  { name: \"Personal and home care\", items: [\"Help with dressing\", \"Help with bathing\", \"Personal hygiene\", \"Oral care\", \"Hair care\", \"Toileting assistance\", \"Mobility assistance\", \"Transfers between bed and chair\", \"Medication reminders\", \"Observe general condition\", \"Report changes to coordinator\"] },\n  { name: \"Practical nursing\", items: [\"Medication organization\", \"Medication administration\", \"Blood pressure measurement\", \"Blood glucose measurement\", \"Temperature measurement\", \"Pulse measurement\", \"Oxygen saturation measurement\", \"Weight monitoring\", \"Basic wound care\", \"Compression stockings\", \"Catheter care\", \"Stoma care\", \"Rehabilitation exercises\", \"Nutrition monitoring\", \"Hydration monitoring\", \"Fall risk monitoring\"] },\n  { name: \"Registered nursing\", items: [\"Nursing assessment\", \"Clinical assessment\", \"Advanced wound care\", \"Injections\", \"IV therapy\", \"Blood sample collection\", \"ECG\", \"Chronic disease monitoring\", \"Palliative care\", \"Care plan evaluation\", \"Physician consultation\", \"Clinical documentation\", \"Coordination with healthcare providers\", \"Family education\"] },\n];\nconst SERVICES = CATALOG.flatMap(c => c.items);\nconst CATEGORY_OF = {};\nfor (const c of CATALOG) for (const s of c.items) CATEGORY_OF[s] = c.name;\nconst MONTHS = [\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"];\nconst FEE = 0.1, NOW_HOUR = 8, TODAY_MONTH = \"August 2026\", DAY = 86400000, LATE_HOURS = 1;\n\nconst eur = n => Number.isInteger(n) ? \"\\u20AC\" + n : \"\\u20AC\" + n.toFixed(2);\nconst eur2 = n => \"\\u20AC\" + Number(n).toFixed(2);\nconst feeOf = g => g * FEE;\nconst netOf = g => g - g * FEE;\nconst r2 = n => Math.round(n * 100) \u002F 100;\nconst stamp = d => d.getDate() + \" \" + MONTHS[d.getMonth()] + \" \" + d.getFullYear();\nconst clock = h => String(h).padStart(2, \"0\") + \":00\";\nconst plural = (n, w) => n + \" \" + w + (n === 1 ? \"\" : \"s\");\n\nconst addHours = (start, h) => {\n  const p = String(start).split(\":\").map(Number);\n  const total = p[0] * 60 + p[1] + Math.round(h * 60);\n  return String(Math.floor(total \u002F 60) % 24).padStart(2, \"0\") + \":\" + String(total % 60).padStart(2, \"0\");\n};\nconst monthOf = date => {\n  const parts = String(date).split(\" \");\n  const i = parts.findIndex(p => MONTHS.includes(p));\n  if (i === -1) return TODAY_MONTH;\n  const y = parts[i + 1];\n  return parts[i] + \" \" + (\u002F^\\d{4}$\u002F.test(y || \"\") ? y : TODAY_MONTH.split(\" \")[1]);\n};\nconst ROLLED = { Tomorrow: \"Today\", Today: \"Yesterday\", Yesterday: \"2 days ago\" };\nconst rollDate = date => {\n  if (ROLLED[date]) return ROLLED[date];\n  const m = \u002F^(\\d+) days ago$\u002F.exec(date);\n  return m ? (Number(m[1]) + 1) + \" days ago\" : date;\n};\nconst hoursUntil = v => {\n  const start = Number(String(v.time).slice(0, 2));\n  if (Number.isNaN(start)) return null;\n  if (v.date === \"Today\") return start - NOW_HOUR;\n  if (v.date === \"Tomorrow\") return start + (24 - NOW_HOUR);\n  return null;\n};\nconst isLate = v => { const h = hoursUntil(v); return h !== null && h < LATE_HOURS; };\n\nconst activeV = a => a && a.versions.find(v => v.status === \"ACTIVE\");\nconst pendingV = a => a && a.versions.find(v => v.status === \"AWAITING_CLIENT\");\nconst relState = a => {\n  if (!a) return \"NONE\";\n  if (a.endedOn) return \"ENDED\";\n  const act = activeV(a), pen = pendingV(a);\n  if (act && pen) return \"REVISION_PENDING\";\n  if (act) return \"ACTIVE\";\n  if (pen) return \"FIRST_AGREEMENT_SENT\";\n  if (a.versions.some(v => v.status === \"DECLINED\")) return \"DECLINED\";\n  return \"NONE\";\n};\n\nlet uid = 100;\nconst nid = p => p + (uid++);\n\n\u002F* ── seed ─────────────────────────────────────────────────────────────────── *\u002F\n\nconst history = (clientId, name, o) => {\n  const visits = [], ledger = [], activities = [];\n  for (let i = 0; i < o.count; i++) {\n    const day = new Date(o.last.getTime() - i * o.everyDays * DAY);\n    const worked = o.hours[i % o.hours.length];\n    const start = 9 + (i % 3);\n    const vid = clientId + (o.cg || \"cg1\") + \"v\" + i;\n    const amount = worked * o.rate;\n    visits.push({\n      id: vid, clientId, caregiverId: o.cg || \"cg1\", date: stamp(day),\n      time: clock(start) + \" \\u2013 \" + clock(start + worked), hours: worked, rate: o.rate,\n      agreementVersion: 1, status: \"CAPTURED\",\n      workOrder: { hours: worked, note: o.notes[i % o.notes.length], extraHours: 0,\n        autoConfirmed: i % 4 !== 0, mood: i % 5 === 0 ? \"low\" : \"good\", eating: \"same\",\n        moving: i % 7 === 0 ? \"worse\" : \"same\", tasksDone: o.tasks },\n    });\n    const label = name + \" \\u00B7 \" + stamp(day);\n    ledger.push(\n      { id: vid + \"c\", label, amount, kind: \"captured\", date: stamp(new Date(day.getTime() + DAY)), paidOn: stamp(new Date(day.getTime() + 4 * DAY)), visitId: vid, caregiverId: o.cg || \"cg1\" },\n      { id: vid + \"h\", label, amount, kind: \"held\", date: stamp(new Date(day.getTime() - DAY)), visitId: vid, caregiverId: o.cg || \"cg1\" },\n    );\n  }\n  const opened = visits[visits.length - 1], closed = visits[0];\n  activities.push(\n    { id: clientId + (o.cg || \"cg1\") + \"a0\", clientId, kind: \"alert\", title: \"Booking confirmed\", meta: opened.date + \" \\u00B7 relationship established\", by: \"you\", at: \"10:20\" },\n    { id: clientId + (o.cg || \"cg1\") + \"a1\", clientId, kind: \"agreement\", title: \"Care agreement v1 sent\", meta: opened.date + \" \\u00B7 \" + o.tasks.length + \" services, \" + eur2(o.rate) + \"\u002Fhour\", by: \"you\", at: \"10:35\" },\n    { id: clientId + (o.cg || \"cg1\") + \"a2\", clientId, kind: \"agreement\", title: \"Terms confirmed\", meta: opened.date + \" \\u00B7 payment method linked\", by: \"client\", at: \"19:02\" },\n  );\n  for (let i = visits.length - 1; i >= 0; i--) {\n    const v = visits[i], amount = v.hours * v.rate;\n    activities.push(\n      { id: v.id + \"a1\", clientId, kind: \"visit\", title: \"Visit sent \\u00B7 \" + v.date + \", \" + v.hours + \" h\", meta: v.date + \" \\u00B7 \" + eur2(amount) + \" reserved\", by: \"you\", at: \"20:10\" },\n      { id: v.id + \"a2\", clientId, kind: \"visit\", title: \"Work order sent\", meta: v.date + \" \\u00B7 \" + v.hours + \" h, no changes\", detail: v.workOrder.note, by: \"you\", at: v.time.split(\" \\u2013 \")[1] },\n      { id: v.id + \"a3\", clientId, kind: \"money\", title: \"Payment captured\", meta: v.date + \" \\u00B7 \" + eur2(amount) + \" charged\",\n        detail: v.workOrder.autoConfirmed ? \"Confirmed automatically after 24 hours without objection.\" : \"The family confirmed the work order.\",\n        by: v.workOrder.autoConfirmed ? \"system\" : \"client\", at: v.workOrder.autoConfirmed ? \"09:00\" : \"18:40\" },\n    );\n  }\n  activities.push({ \n    if (p && p.kind === \"wo\") {\n      const v = this.d().visits.find(x => x.id === p.visitId);\n      const a = v ? this.arr(v.clientId, v.caregiverId) : null;\n      const cg = v ? (this.cg(v.caregiverId) || { name: \"Your caregiver\" }) : { name: \"Your caregiver\" };\n      const first = cg.name.split(\" \")[0];\n      const o = v ? v.workOrder : null;\n      const agreed = (activeV(a) || { services: [] }).services;\n      const hours = o ? o.hours : (v ? v.hours : 0);\n      const charged = v ? Math.min(hours, v.hours) * v.rate : 0;\n      out.modalTitle = \"Work order from \" + first;\n      out.modalSub = v ? v.date + \" \\u00B7 \" + v.time : \"\";\n      out.woTasksShown = o ? o.tasksDone.map(t => ({ label: t })) : [];\n      const bits = [];\n      if (o && o.mood) bits.push({ text: \"Mood: \" + MOOD_LABEL[o.mood].toLowerCase(), style: \"\" });\n      if (o && o.eating) bits.push({ text: \"Eating: \" + SIGNAL_LABEL[o.eating].toLowerCase(), style: \"\" });\n      if (o && o.moving) bits.push({ text: \"Moving: \" + SIGNAL_LABEL[o.moving].toLowerCase(), style: \"\" });\n      if (o) { const sk = agreed.filter(t => !o.tasksDone.includes(t)); if (sk.length) bits.push({ text: \"did not get to: \" + sk.join(\", \"), style: \"color:rgba(78,59,49,.55)\" }); }\n      out.woCareShown = bits;\n      out.woNoteShown = o && o.note ? \"\\u201C\" + o.note + \"\\u201D\" : \"\";\n      out.woChargeText = hours + \" h at \" + eur(v ? v.rate : 0) + \"\u002Fh \\u2014 \" + eur(charged) + \" is taken \" + AUTO_AT + \" unless you say something is wrong.\";\n      out.woExtraText = o && o.extraHours > 0 ? o.extraHours + \" h more than was reserved. Only the reserved \" + eur(charged) + \" can be taken \\u2014 the extra comes to you as a separate request.\" : \"\";\n      out.woDeciding = !st.disputing;\n      out.woDisputing = st.disputing;\n      out.woConfirm = () => this.confirmWorkOrder(p.visitId);\n      out.woStartDispute = () => this.setState({ disputing: true, why: \"\" });\n      out.woBack = () => this.setState({ disputing: false });\n      out.woDisputeNote = \"Nothing is charged while this is open. A coordinator reads it, not \" + first + \".\";\n      out.woSendDispute = () => st.why.trim() === \"\" ? this.flash(\"Say what was not right \\u2014 a coordinator reads it.\") : this.disputeVisit(p.visitId, st.why.trim());\n    }\n\n    if (p && p.kind === \"plan\") {\n      const v = this.d().visits.find(x => x.id === p.visitId);\n      const cg = v ? (this.cg(v.caregiverId) || { name: \"Your caregiver\" }) : { name: \"Your caregiver\" };\n      const first = cg.name.split(\" \")[0];\n      const elder = family ? family.name.split(\" \")[0] : \"them\";\n      const held = v ? v.hours * v.rate : 0;\n      const late = v ? isLate(v) : false;\n      const away = v ? hoursUntil(v) : null;\n      out.modalTitle = \"Visit plan from \" + first;\n      out.modalSub = v ? v.date + \" \\u00B7 \" + v.time : \"\";\n      out.planBody = first + \" plans to come for \" + (v ? v.hours : 0) + \" h. \" + eur(held) + \" is reserved, not charged \\u2014 the money is only taken after the visit, once she has sent the work order for it.\";\n      out.planIdle = st.offMode === \"none\";\n      out.planQuery = st.offMode === \"query\";\n      out.planCallOff = st.offMode === \"call-off\";\n      out.planStartQuery = () => this.setState({ offMode: \"query\", why: \"\" });\n      out.planStartCallOff = () => this.setState({ offMode: \"call-off\" });\n      out.planBack = () => this.setState({ offMode: \"none\" });\n      out.planQueryNote = \"The reservation stays where it is while this is open, and \" + first + \" is told not to come until it is settled. A coordinator reads it, not \" + first + \".\";\n      out.planSendQuery = () => st.why.trim() === \"\" ? this.flash(\"Say what is wrong with the plan.\") : this.disputeVisit(p.visitId, st.why.trim());\n      out.planOffStyle = \"font-size:13px;line-height:1.55;margin:0;color:\" + (late ? \"#7A2E1A\" : \"rgba(78,59,49,.78)\");\n      out.planOffBody = late\n        ? \"This is less than an hour before \" + first + \" is due, so the \" + eur(held) + \" reserved for it is charged in full rather than released. She has held the time and cannot fill it now.\"\n        : \"The \" + eur(held) + \" reserved for it is released straight away and nothing is charged. \" + first + \" is told, and your coordinator will help arrange another day if \" + elder + \" still needs one.\"\n          + (away !== null ? \" Inside the last hour before she is due, it is charged in full instead \\u2014 she is due in \" + away + \" h.\" : \"\");\n      const reasons = [\"We do not need it\", \"A family emergency\", \"Other\"];\n      out.planReasons = reasons.map(rn => ({ label: rn, style: chipStyle(st.offReason === rn), pick: () => this.setState({ offReason: rn }) }));\n      out.planOther = st.offReason === \"Other\";\n      const okReason = st.offReason !== \"Other\" || st.offOther.trim() !== \"\";\n      out.planOffBtnStyle = okReason\n        ? \"font-size:13.5px;font-weight:600;color:#FFF8F0;background:#9C3B2E;border:none;border-radius:8px;padding:9px 15px\"\n        : \"font-size:13.5px;font-weight:600;color:#FFF8F0;background:rgba(156,59,46,.4);border:none;border-radius:8px;padding:9px 15px\";\n      out.planOffBtnLabel = late ? \"Call it off and pay \" + eur(held) : \"Call it off and release the money\";\n      out.planDoCallOff = () => okReason\n        ? this.cancelVisit(p.visitId, st.offReason === \"Other\" ? st.offOther.trim() : st.offReason, \"the client\")\n        : this.flash(\"Say why it is not happening.\");\n    }\n\n    \u002F* ── the three forms, now that they are opened from the board as well ── *\u002F\n    if (isCg && (st.agrEditing || st.visitForm || st.woOpen)) {\n      const kind = st.woOpen ? \"wo-fill\" : st.visitForm ? \"plan-new\" : \"agr\";\n      const fv = st.woOpen ? this.d().visits.find(x => x.id === st.woOpen) : null;\n      const cid = fv ? fv.clientId : st.openClientId;\n      const fc = this.client(cid);\n      const fa = this.arr(cid, st.cgId);\n      const fact = activeV(fa);\n      const first = fc ? fc.payer.name.split(\" \")[0] : \"the family\";\n      const elder = fc ? fc.name.split(\" \")[0] : \"them\";\n      const agreed = fact ? fact.services : [];\n\n      if (kind === \"agr\") {\n        out.isRevision = Boolean(fact);\n        out.agrFormKicker = fact ? \"Version \" + (fa.versions.length + 1) + \" \\u00B7 draft\" : \"First agreement \\u00B7 draft\";\n        const runningNow = this.openVisitsOf(st.openClientId, st.cgId).length + this.pairVisits(st.openClientId, st.cgId).filter(v => v.status === \"WORK_ORDER_SENT\").length;\n      out.revisionNote = runningNow > 0\n        ? \"This version applies to visits after the \" + plural(runningNow, \"visit\") + \" already running. Those keep the hours and rate they went out at, and are billed on the version in force.\"\n        : \"The version in force stays as it is until \" + first + \" confirms, and new visits pause meanwhile.\";\n        const q = st.query.trim().toLowerCase();\n      const picked = st.agrSel;\n      out.agrFormTitle = fact ? \"New version of the agreement\" : \"Services this agreement covers\";\n      out.notePlaceholder = elder + \" needs help with medication as well.\";\n      out.query = st.query;\n      out.onQuery = this.onQuery;\n      out.agrTerms = st.agrTerms;\n      out.onTerms = this.onTerms;\n      out.clearSelection = this.clearSelection;\n      out.hasSelection = picked.length > 0;\n      out.selectedCountLabel = picked.length ? plural(picked.length, \"service\") + \" selected\" : \"Nothing picked yet \\u2014 tick what this agreement covers\";\n      out.selectedServices = picked.map(s => ({ label: s, category: CATEGORY_OF[s] || \"\", toggle: () => this.toggleSvc(s) }));\n      out.catalog = CATALOG.map(cat => {\n        const items = cat.items.filter(s => !q || s.toLowerCase().includes(q));\n        const on = cat.items.filter(s => picked.includes(s)).length;\n        return {\n          name: cat.name,\n          picked: on ? on + \" of \" + cat.items.length : \"\",\n          items: items.map(s => ({ label: s, selected: picked.includes(s), rowStyle: svcRow(picked.includes(s)), toggle: () => this.toggleSvc(s) })),\n        };\n      }).filter(cat => cat.items.length > 0);\n      out.noResults = q && out.catalog.length === 0 ? \"No service matches \\u201C\" + st.query + \"\\u201D. Try a shorter word.\" : \"\";\n      out.rateErr = st.rateErr;\n      out.toReview = this.toReview;\n      out.backToForm = this.backToForm;\n      const draftRate = parseFloat(String(st.agrRate).replace(\",\", \".\"));\n      out.draftSummary = picked.length\n        ? plural(picked.length, \"service\") + (isFinite(draftRate) ? \" at \" + eur2(draftRate) + \" an hour\" : \", no rate yet\")\n        : \"No services picked yet.\";\n      out.reviewTitle = fact ? \"Version \" + (fa.versions.length + 1) + \" for \" + first + \" to confirm\" : \"Ready to send to \" + first;\n      out.reviewRate = isFinite(draftRate) ? eur2(draftRate) + \"\u002Fh\" : \"\";\n      const draftHours = parseFloat(String(st.agrHours).replace(\",\", \".\"));\n      out.reviewHours = isFinite(draftHours) ? draftHours + \" h\" : \"\";\n      out.reviewVisitCost = isFinite(draftHours) && isFinite(draftRate) ? \"Each visit comes to \" + eur2(draftHours * draftRate) : \"Every visit is planned at this length\";\n      out.visitCost = isFinite(draftHours) && isFinite(draftRate) ? \"A visit comes to \" + eur2(draftHours * draftRate) + \", of which you receive \" + eur2(netOf(draftHours * draftRate)) + \".\" : \"\";\n      out.agrTermsShown = st.agrTerms.trim();\n      out.reviewSendLabel = \"Send to \" + first;\n      out.reviewLockNote = fact\n        ? \"The version in force keeps running until \" + first + \" confirms this one. Visits already sent keep the rate they went out at, and new visits pause meanwhile.\"\n        : \"Visits stay locked until \" + first + \" confirms these terms\" + (fc && fc.paymentLinked ? \"\" : \" and links a payment method\") + \". You never see card details.\";\n        out.agrRate = st.agrRate;\n        out.onAgrRate = this.onAgrRate;\n        out.agrHours = st.agrHours;\n        out.onAgrHours = this.onAgrHours;\n        out.hoursErr = st.hoursErr;\n        out.agrNote = st.agrNote;\n        out.onAgrNote = this.onAgrNote;\n        out.agrErr = st.agrErr;\n        out.sendAgreement = this.sendAgreement;\n        out.closeAgrForm = this.closeAgrForm;\n        const rateNum = parseFloat(String(st.agrRate).replace(\",\", \".\"));\n        out.rateDelta = fact && isFinite(rateNum) && rateNum !== fact.hourlyRate ? eur(fact.hourlyRate) + \" \\u2192 \" + eur(rateNum) + \" per hour\" : \"\";\n      }\n\n      if (kind === \"plan-new\") {\n        const vh = (fact && fact.hours) || parseFloat(String(st.vHours).replace(\",\", \".\")) || 0;\n        const rate = fact ? fact.hourlyRate : 0;\n        const away = hoursUntil({ date: st.vDay, time: st.vStart + \" \\u2013 \" + st.vStart });\n        out.dayTodayStyle = dayStyle(st.vDay === \"Today\");\n        out.dayTomorrowStyle = dayStyle(st.vDay === \"Tomorrow\");\n        out.setToday = this.setToday;\n        out.setTomorrow = this.setTomorrow;\n        out.vStart = st.vStart;\n        out.onVStart = this.onVStart;\n        out.agreedHours = (fact && fact.hours ? fact.hours : 3) + \" h\";\n        out.visitSummary = st.vDay.toLowerCase() + \", \" + st.vStart + \" \\u2013 \" + addHours(st.vStart, vh) + (away !== null ? \" \\u00B7 \" + away + \" h from now\" : \"\");\n        out.lateWarn = away !== null && away < LATE_HOURS ? \"Less than an hour away: if the family calls it off now, the whole amount is charged rather than released.\" : \"\";\n        out.resGross = eur2(vh * rate);\n        out.resFee = \"\\u2212\" + eur2(feeOf(vh * rate));\n        out.resNet = eur2(netOf(vh * rate));\n        out.sendVisit = this.sendVisit;\n        out.closeVisitForm = this.closeVisitForm;\n      }\n\n      if (kind === \"wo-fill\" && fv) {\n        const woHours = parseFloat(String(st.woHours).replace(\",\", \".\")) || 0;\n        const covered = Math.min(woHours, fv.hours);\n        const extra = Math.max(0, woHours - fv.hours);\n        const releasedH = Math.max(0, fv.hours - woHours);\n        out.woHours = st.woHours;\n        out.onWoHours = this.onWoHours;\n        out.woNote = st.woNote;\n        out.onWoNote = this.onWoNote;\n        out.woMoodQuestion = \"How was \" + elder + \" today?\";\n        out.woMoods = [\"low\", \"same\", \"good\"].map(x => ({ label: MOOD_LABEL[x], style: chipStyle(st.woMood === x), pick: () => this.setState({ woMood: x }) }));\n        out.woEating = [\"worse\", \"same\", \"better\"].map(x => ({ label: SIGNAL_LABEL[x], style: chipStyle(st.woEat === x), pick: () => this.setState({ woEat: x }) }));\n        out.woMoving = [\"worse\", \"same\", \"better\"].map(x => ({ label: SIGNAL_LABEL[x], style: chipStyle(st.woMove === x), pick: () => this.setState({ woMove: x }) }));\n        out.woTaskItems = agreed.map(x => ({ label: x, style: chipStyle(st.woTasks.includes(x)), toggle: () => this.setState(s => ({ woTasks: s.woTasks.includes(x) ? s.woTasks.filter(y => y !== x) : s.woTasks.concat([x]) })) }));\n        out.woConcernOpen = st.woConcernOpen;\n        out.woConcernClosed = !st.woConcernOpen;\n        out.woConcern = st.woConcern;\n        out.onWoConcern = this.onWoConcern;\n        out.openConcern = this.openConcern;\n        out.woChargeLabel = \"Charged now \\u00B7 \" + covered + \" h\";\n        out.woGross = eur2(covered * fv.rate);\n        out.woFee = \"\\u2212\" + eur2(feeOf(covered * fv.rate));\n        out.woNet = eur2(netOf(covered * fv.rate));\n        out.woReleasedLine = releasedH > 0 ? eur2(releasedH * fv.rate) + \" of the reserved amount goes back to the family \\u2014 the charge can never exceed the hold.\" : \"\";\n        out.woExtraLine = extra > 0 ? extra + \" h above the reserved amount goes to the family as a separate request. It is only charged if they approve it \\u2014 \" + eur2(extra * fv.rate) + \" gross.\" : \"\";\n        out.sendWorkOrder = this.sendWorkOrder;\n        out.closeWo = this.closeWo;\n      }\n    }\n\n    foot();\n    return out;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
